<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noty</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">Noty</div>
        <div class="sidebar-section-title">主导航</div>
        <nav class="sidebar-nav" aria-label="主导航">
          <a class="nav-item is-active" href="#workspaces" aria-current="page">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="7" height="7" rx="1.5" />
                <rect x="14" y="4" width="7" height="7" rx="1.5" />
                <rect x="3" y="14" width="7" height="7" rx="1.5" />
                <rect x="14" y="14" width="7" height="7" rx="1.5" />
              </svg>
            </span>
            <span>工作区</span>
          </a>
        </nav>
      </aside>

      <main class="content">
        <div class="content-inner">
          <header class="page-header">
            <h1 class="page-title">工作区</h1>
            <div class="toolbar">
              <button type="button" class="btn btn-primary" id="toolbarSyncBtn">
                同步 tmux
              </button>
            </div>
          </header>

          <!-- Renderer main.ts (compiled to main.bundle.js) mounts empty
               state or the workspace grid here. -->
          <section id="workspaceRoot" aria-live="polite"></section>
        </div>
      </main>
    </div>

    <script src="main.bundle.js"></script>
  </body>
</html>
