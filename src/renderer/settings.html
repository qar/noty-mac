<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 - Noty</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .settings-container {
      width: 500px;
      height: 600px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .settings-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .section {
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 12px;
    }

    .channel-list {
      background: white;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .channel-item {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .channel-item:last-child {
      border-bottom: none;
    }

    .channel-info {
      flex: 1;
    }

    .channel-name {
      font-weight: 500;
      color: #333;
      margin-bottom: 4px;
    }

    .channel-url {
      font-size: 12px;
      color: #999;
    }

    .remove-btn {
      background: #FF3B30;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .remove-btn:hover {
      background: #D32F2F;
    }

    .add-channel-form {
      background: white;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      padding: 16px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: #007AFF;
    }

    .add-btn {
      width: 100%;
      padding: 10px;
      background: #34C759;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .add-btn:hover {
      background: #2DA84E;
    }

    .settings-group {
      background: white;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      padding: 16px;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .setting-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .setting-item:first-child {
      padding-top: 0;
    }

    .setting-label {
      font-size: 14px;
      color: #333;
    }

    .toggle {
      position: relative;
      width: 48px;
      height: 28px;
      background: #ccc;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle.active {
      background: #34C759;
    }

    .toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px;
      height: 24px;
      background: white;
      border-radius: 12px;
      transition: transform 0.2s;
    }

    .toggle.active .toggle-thumb {
      transform: translateX(20px);
    }

    .empty-channels {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="settings-container">
    <div class="header">
      <h2>设置</h2>
      <button id="closeBtn" class="icon-btn" title="关闭">✕</button>
    </div>

    <div class="settings-content">
      <!-- 频道管理 -->
      <div class="section">
        <div class="section-title">订阅频道</div>
        <div id="channelList" class="channel-list">
          <!-- 频道列表将动态插入 -->
        </div>
      </div>

      <!-- 添加频道 -->
      <div class="section">
        <div class="section-title">添加频道</div>
        <div class="add-channel-form">
          <div class="form-group">
            <label class="form-label">频道名称</label>
            <input type="text" id="channelName" class="form-input" placeholder="例如: 我的通知">
          </div>
          <div class="form-group">
            <label class="form-label">频道地址</label>
            <input type="text" id="channelUrl" class="form-input" placeholder="例如: Rco57HU-claude-update 或完整 URL">
          </div>
          <button id="addChannelBtn" class="add-btn">添加频道</button>
        </div>
      </div>

      <!-- 偏好设置 -->
      <div class="section">
        <div class="section-title">偏好设置</div>
        <div class="settings-group">
          <div class="setting-item">
            <div class="setting-label">声音提示</div>
            <div id="soundToggle" class="toggle">
              <div class="toggle-thumb"></div>
            </div>
          </div>
          <div class="setting-item">
            <div class="setting-label">隐藏已读通知</div>
            <div id="hideReadToggle" class="toggle">
              <div class="toggle-thumb"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
